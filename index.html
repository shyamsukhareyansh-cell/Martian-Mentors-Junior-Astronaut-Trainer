 $('#challengeSubmit').onclick=()=>{

 };
}

function showReport(){let a=state.allocation;showModal('MISSION DEBRIEF',`<div class="eyebrow">CHAPTER ONE · CURRENT RECORD</div><p>Rooms unlocked: ${state.unlocked.length}/11</p><p>Evidence recovered: ${state.evidence.length}</p><p>Storm allocation: ${a?`${a.life} EU life support, ${a.green} EU greenhouse, ${a.other} EU other systems.`:'Not completed.'}</p><p>Systems now: ${state.resources.power} EU power · ${state.resources.water} WU water · ${state.resources.food} FU food.</p><p>Science learned: electricity made by the solar panels falls when dust reduces incoming sunlight; stored energy must be prioritised; life support has essential requirements; greenhouse and water systems affect food production.</p><button class="primary" id="backGame">RETURN TO ANNEX</button>`);$('#backGame').onclick=()=>{overlay.innerHTML='';state.room='annex';renderGame()}}

renderTitle();
})();
</script></body></html>
